<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC Studio — Theory & Practice</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,Arial;color:#18243a;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}aside{width:245px;background:#111c36;color:#d8e2fb;position:fixed;inset:0 auto 0 0;padding:25px 15px;overflow:auto}.logo{font-weight:850;color:white;font-size:23px;margin:0 10px 8px}.small{font-size:12px;color:#91a1bf;margin:0 10px 30px}.nav{display:block;width:100%;text-align:left;padding:14px;border:0;border-radius:12px;background:transparent;color:#b9c7e5;margin:5px 0;font-weight:700}.nav.active{background:#344d90;color:white}.nav:hover{background:#29385b}main{margin-left:245px;max-width:1300px;padding:35px 45px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.eyebrow{color:#5d70a0;font-weight:800;font-size:12px;letter-spacing:2px;text-transform:uppercase}h1{font-size:30px;margin:7px 0 10px}h2{margin:0 0 12px}h3{margin:0 0 12px}p{line-height:1.7}.muted{color:#697792}.card{background:white;border:1px solid #e3e8f2;border-radius:18px;padding:24px;margin:17px 0;box-shadow:0 6px 25px #182e5007}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px}.tile{padding:19px;border:1px solid #e2e8f4;border-radius:15px;background:#fbfcff;text-align:left}.tile:hover{border-color:#6483da}.tile strong{display:block;margin:8px 0}.tag{display:inline-block;border-radius:8px;background:#eaf0ff;color:#3153a2;padding:5px 9px;font-size:12px;font-weight:750}.btn{border:1px solid #cfd9ed;background:white;color:#2b4176;border-radius:11px;padding:11px 16px;font-weight:750}.btn.primary{background:#3459bd;border-color:#3459bd;color:white}.btn.good{background:#e8f7ef;color:#13633b}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.tabs button{border:1px solid #d8e0ee;border-radius:10px;padding:11px 16px;background:white;font-weight:750;color:#4a5c7f}.tabs button.active{background:#273f83;color:white}.formula{padding:16px;background:#eef3ff;border-left:4px solid #4168c8;border-radius:9px;color:#25499b;font-weight:800;margin:12px 0;line-height:1.8}.example{padding:12px 16px;background:#f5f8fc;border-radius:9px;margin:10px 0}.input,select{padding:12px 14px;border:1px solid #cbd6e7;border-radius:10px;background:white;color:#1b2b4b;max-width:100%}.input{width:100%;margin:10px 0}.question{font-size:23px;font-weight:700;line-height:1.6;white-space:pre-line;margin:20px 0}.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.choice{padding:15px;text-align:left;border:1px solid #d8e1ee;background:#fff;border-radius:12px;line-height:1.5}.choice:hover{border-color:#4e70ce}.choice.chosen{background:#e8efff;border-color:#4167c5}.choice.correct{background:#e8f7ed;border-color:#32a36b}.choice.wrong{background:#fff0ee;border-color:#db6b5d}.feedback{padding:17px;border-radius:12px;background:#f0f5ff;margin-top:18px;line-height:1.8}.progress{height:9px;border-radius:8px;background:#e7ecf5;overflow:hidden}.progress div{height:100%;background:#4169ce;transition:width .2s}.flash{min-height:220px;border:2px dashed #b5c6ec;border-radius:17px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:750;line-height:1.6;padding:25px;background:#f9fbff;cursor:pointer}.stat{font-size:28px;font-weight:850;color:#2e4b9d}.hidden{display:none!important}.notice{font-size:13px;color:#647390}.checkline{display:flex;align-items:center;gap:9px;padding:8px 0}.checkline input{accent-color:#3c62c5}hr{border:0;border-top:1px solid #e5eaf2;margin:22px 0}@media(max-width:850px){aside{position:static;width:100%;padding:14px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}.logo{font-size:18px}.small{display:none}.nav{width:auto;padding:9px;font-size:13px}main{margin:0;padding:20px 14px}h1{font-size:24px}.question{font-size:19px}.card{padding:18px}}
</style></head><body><aside><div class="logo">✦ TOEIC Studio</div><div class="small">LEARN · RECALL · MASTER</div><button class="nav active" data-page="home">⌂ Tổng quan</button><button class="nav" data-page="theory">▤ 01 · Ghi nhớ lý thuyết</button><button class="nav" data-page="practice">✎ 02 · Bài tập vận dụng</button><button class="nav" data-page="mistakes">↻ Ôn câu sai</button></aside><main><div id="app"></div></main><script>
const topics=[
{id:'present',name:'Hiện tại đơn',short:'Present Simple',rule:'(+) S + V(s/es) · (−) S + do/does not + V₀ · (?) Do/Does + S + V₀?',notes:'He/She/It và danh từ số ít dùng V-s/es, does; I/You/We/They dùng V₀, do. Sau does/doesn’t luôn là V₀.',signals:'every day, usually, often, seldom, hardly ever, once a week',examples:['She works in accounting.','Does he prepare reports every week?'],q:[['She ___ financial reports every Monday.','prepares','prepare|preparing|prepared','He/She/It + V-s/es.'],['___ your colleagues work on Saturdays?','Do','Does|Are|Did','Colleagues số nhiều nên dùng Do.'],['He doesn’t ___ coffee at work.','drink','drinks|drinking|drank','Sau doesn’t là V nguyên mẫu.']]},
{id:'continuous',name:'Hiện tại tiếp diễn',short:'Present Continuous',rule:'(+) S + am/is/are + V-ing · (−) S + am/is/are + not + V-ing · (?) Am/Is/Are + S + V-ing?',notes:'Diễn tả hành động đang xảy ra hoặc tình huống tạm thời. I am; he/she/it is; you/we/they are.',signals:'now, at the moment, currently, right now',examples:['They are reviewing the contract now.','Is she attending a meeting?'],q:[['The manager ___ a client at the moment.','is meeting','meets|meet|met','At the moment → am/is/are + V-ing.'],['They ___ the equipment right now.','are inspecting','inspect|inspects|inspected','They + are + V-ing.'],['___ she preparing the presentation?','Is','Does|Has|Did','Câu hỏi tiếp diễn đảo to be lên trước chủ ngữ.']]},
{id:'perfect',name:'Hiện tại hoàn thành',short:'Present Perfect',rule:'(+) S + have/has + V₃ · (−) S + have/has not + V₃ · (?) Have/Has + S + V₃?',notes:'Dùng với kinh nghiệm, kết quả còn liên quan hiện tại, hoặc trạng thái kéo dài tới nay. Since + mốc thời gian; for + khoảng thời gian. Không dùng với thời điểm quá khứ đã kết thúc như yesterday.',signals:'since, for, already, yet, ever, never, recently, lately, so far, up to now',examples:['We have completed the project.','She has worked here since 2021.'],q:[['She ___ at this company since 2021.','has worked','worked|works|is working','Since + mốc thời gian → thường dùng hiện tại hoàn thành cho trạng thái kéo dài.'],['Have you ___ the invoice yet?','sent','send|sending|sends','Have + V₃: send–sent–sent.'],['We ___ three reports so far.','have finished','finished|are finishing|finish','So far → hiện tại hoàn thành.']]},
{id:'past',name:'Quá khứ đơn',short:'Past Simple',rule:'(+) S + V₂/ed · (−) S + did not + V₀ · (?) Did + S + V₀?',notes:'Động từ thường dùng did trong phủ định/nghi vấn; sau did là V₀. Với be: was/were, không dùng did. I/he/she/it was; you/we/they were.',signals:'yesterday, last week, last month, ... ago, in 2020',examples:['The company hired new staff last year.','Was the equipment repaired yesterday?'],q:[['The team ___ the contract yesterday.','signed','sign|signs|has signed','Yesterday → quá khứ đơn.'],['___ the equipment repaired last Friday?','Was','Did|Were|Does','Equipment không đếm được, câu bị động: Was + S + V₃?'],['Did they ___ the documents?','submit','submitted|submits|submitting','Sau Did dùng V₀.']]},
{id:'future',name:'Tương lai đơn',short:'Future Simple',rule:'(+) S + will + V₀ · (−) S + will not/won’t + V₀ · (?) Will + S + V₀?',notes:'Will không thay đổi theo chủ ngữ. Sau will/won’t luôn là động từ nguyên mẫu.',signals:'tomorrow, next week, next month, in the future',examples:['We will contact the supplier tomorrow.','Will the director approve the proposal?'],q:[['We ___ the order tomorrow.','will ship','shipped|shipping|ships','Tomorrow → will + V₀ trong câu dự đoán/kế hoạch.'],['She won’t ___ late.','arrive','arrives|arrived|arriving','Sau won’t là V₀.'],['___ they join the conference next week?','Will','Do|Did|Have','Câu hỏi tương lai: Will + S + V₀?']]},
{id:'modals',name:'Động từ khuyết thiếu',short:'Modal Verbs',rule:'S + can/could/may/might/must/should/would + V₀',notes:'Can: khả năng; could: khả năng/lời đề nghị lịch sự; may/might: khả năng; must: bắt buộc hoặc suy luận mạnh; should: lời khuyên; would: giả định/lịch sự. Không thêm -s sau modal.',signals:'can, could, may, might, must, should, would',examples:['Employees must wear safety equipment.','You should review the document.'],q:[['You should ___ the report carefully.','review','reviews|reviewed|reviewing','Sau should dùng V₀.'],['He can ___ English fluently.','speak','speaks|speaking|spoke','Can + V₀.'],['Employees must ___ their ID cards.','carry','carries|carried|carrying','Must + V₀.']]},
{id:'wordform',name:'Từ loại & hậu tố',short:'Word Forms',rule:'Noun (N) · Verb (V) · Adjective (Adj) · Adverb (Adv)',notes:'Danh từ có thể làm S/O; tính từ bổ nghĩa danh từ hoặc theo sau linking verb; động từ diễn tả hành động/trạng thái. Hậu tố là gợi ý, không phải quy tắc tuyệt đối.',signals:'N: -ment, -tion, -ness, -ship, -ance/-ence · Adj: -ful, -ous, -al, -able/-ible, -ive · V: -ize/-ise, -ify',examples:['The company announced a new development.','We need an effective solution.'],q:[['The company needs an ___ solution.','effective','effect|effectively|effectiveness','Trước danh từ solution cần tính từ effective.'],['The new ___ starts on Monday.','development','develop|developing|developed','Sau the new cần danh từ development.'],['The policy will ___ operations.','simplify','simple|simplicity|simplified','Sau will cần V₀.']]},
{id:'nouns',name:'Cụm danh từ & vị trí',short:'Noun Phrases',rule:'Determiner + (Adj) + N · N + N · Possessive + N',notes:'Cụm danh từ có thể làm chủ ngữ/tân ngữ. Mạo từ, tính từ sở hữu, tính từ hoặc danh từ bổ nghĩa đứng trước danh từ chính. Sau giới từ thường là danh từ/cụm danh từ hoặc V-ing.',signals:'a/an/the + N · my/our/their + N · in/on/at + N · business trip, office supplies',examples:['The financial report is ready.','They ordered office supplies.'],q:[['We ordered new office ___ yesterday.','supplies','supplyingly|supplied|supplying','Office supplies là danh từ ghép thông dụng.'],['The ___ report was approved.','financial','finance|financially|finances','Trước report cần tính từ financial.'],['The manager spoke at the press ___.','conference','confer|conferred|conferencing','Press conference là danh từ ghép.']]},
{id:'frequency',name:'Tần suất & chủ ngữ đặc biệt',short:'Frequency & Agreement',rule:'once/twice/three times + a day/week · Everyone/Someone/Anyone + V-s/es',notes:'Everyone, someone, anyone, something, anything là chủ ngữ số ít. Once/twice/three times diễn tả số lần; thường dùng hiện tại đơn cho thói quen.',signals:'once a week, twice a day, three times a month, everyone, someone, anything',examples:['Everyone has a badge.','She exercises twice a week.'],q:[['Everyone ___ a copy of the policy.','has','have|having|are','Everyone là chủ ngữ số ít → has.'],['She attends training ___ a month.','twice','two|second|double','Twice a month = hai lần mỗi tháng.'],['Something ___ wrong with the printer.','is','are|have|were','Something là chủ ngữ số ít.']]}
];
const recallTypes=['Chọn công thức','Tự viết công thức','Nhận biết dấu hiệu','Đúng / Sai','Điền quy tắc','Ghép khái niệm'];
const practiceTypes=['TOEIC chọn đáp án','Điền từ tự luận','Sửa lỗi sai','Sắp xếp câu','Dịch Việt → Anh','Chọn thì phù hợp','Chuyển câu phủ định','Chuyển câu nghi vấn'];
const extra=[{topic:'present',vi:'Cô ấy làm việc mỗi ngày.',en:'She works every day.',wrong:'She work every day.',order:'every|day|She|works',negative:'She does not work every day.',interrogative:'Does she work every day?'},{topic:'continuous',vi:'Họ đang kiểm tra máy móc.',en:'They are inspecting the machines.',wrong:'They is inspecting the machines.',order:'inspecting|are|the machines|They',negative:'They are not inspecting the machines.',interrogative:'Are they inspecting the machines?'},{topic:'perfect',vi:'Anh ấy đã hoàn thành báo cáo.',en:'He has finished the report.',wrong:'He have finished the report.',order:'finished|the report|has|He',negative:'He has not finished the report.',interrogative:'Has he finished the report?'},{topic:'past',vi:'Chúng tôi đã ký hợp đồng hôm qua.',en:'We signed the contract yesterday.',wrong:'We sign the contract yesterday.',order:'yesterday|signed|We|the contract',negative:'We did not sign the contract yesterday.',interrogative:'Did we sign the contract yesterday?'},{topic:'future',vi:'Họ sẽ giao hàng vào ngày mai.',en:'They will deliver the goods tomorrow.',wrong:'They will delivers the goods tomorrow.',order:'tomorrow|the goods|will|They|deliver',negative:'They will not deliver the goods tomorrow.',interrogative:'Will they deliver the goods tomorrow?'},{topic:'modals',vi:'Bạn nên kiểm tra tài liệu.',en:'You should check the document.',wrong:'You should checks the document.',order:'check|You|the document|should',negative:'You should not check the document.',interrogative:'Should you check the document?'}];
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page='home',topic='present',theoryTab='lesson',session=null,cardIndex=0,flipped=false;const saved=JSON.parse(localStorage.getItem('toeicStudioProgress')||'{}');saved.done??={};saved.wrong??=[];saved.stats??={correct:0,total:0};function persist(){localStorage.setItem('toeicStudioProgress',JSON.stringify(saved))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function say(s,rate=1.17){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=rate;let v=speechSynthesis.getVoices().find(v=>v.lang==='en-US'&&/Google|Microsoft|Samantha|Jenny/i.test(v.name));if(v)u.voice=v;speechSynthesis.speak(u)}function go(p){page=p;session=null;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));render()}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.page));function header(sub,title,description){return `<div class="eyebrow">${sub}</div><h1>${title}</h1><p class="muted">${description}</p>`}function render(){let a=$('#app');if(page==='home'){a.innerHTML=header('Your learning workspace','TOEIC Grammar Studio','Hai khu học tập độc lập: ghi nhớ kiến thức trước, luyện đề TOEIC sau.')+`<div class="grid"><div class="card"><span class="tag">GIAI ĐOẠN 01</span><h2>Ghi nhớ lý thuyết</h2><p>9 bài học · flashcards · 6 kiểu kiểm tra trí nhớ · ôn lại công thức.</p><button class="btn primary" onclick="go('theory')">Vào khu lý thuyết →</button></div><div class="card"><span class="tag">GIAI ĐOẠN 02</span><h2>Bài tập luyện tập</h2><p>8 dạng bài · chọn chủ đề · trộn dạng · giải thích từng câu · nghe giọng Mỹ.</p><button class="btn primary" onclick="go('practice')">Vào khu bài tập →</button></div></div><div class="card"><h2>Tiến độ của bạn</h2><div class="grid"><div><div class="stat">${Object.keys(saved.done).length}/9</div><p class="muted">Chủ đề đã đánh dấu học</p></div><div><div class="stat">${saved.stats.total?Math.round(saved.stats.correct/saved.stats.total*100):0}%</div><p class="muted">Tỷ lệ đúng</p></div><div><div class="stat">${saved.wrong.length}</div><p class="muted">Câu cần ôn lại</p></div></div></div>`;return}
if(page==='theory'){a.innerHTML=header('01 / THEORY MEMORY','Ghi nhớ lý thuyết','Học bài → tự nhớ công thức → kiểm tra trí nhớ. Không trộn với phần bài tập TOEIC.')+`<div class="tabs"><button class="${theoryTab==='lesson'?'active':''}" onclick="theoryTab='lesson';render()">📖 Bài học</button><button class="${theoryTab==='cards'?'active':''}" onclick="theoryTab='cards';cardIndex=0;flipped=false;render()">▣ Flashcards</button><button class="${theoryTab==='recall'?'active':''}" onclick="theoryTab='recall';session=null;render()">🧠 Kiểm tra lý thuyết</button></div>`+ (theoryTab==='lesson'?lessonUI():theoryTab==='cards'?flashUI():recallUI());return}
if(page==='practice'){a.innerHTML=header('02 / APPLICATION PRACTICE','Bài tập luyện tập TOEIC','Áp dụng lý thuyết vào câu thật. Chọn nhiều dạng bài để luyện xen kẽ.')+(session?questionUI():setupUI('practice'));return}
if(page==='mistakes'){a.innerHTML=header('REVIEW','Ôn tập câu sai','Những câu đã trả lời sai được lưu trên trình duyệt này.')+`<div class="card"><p>Hiện có <b>${saved.wrong.length}</b> câu cần ôn.</p><div class="actions"><button class="btn primary" onclick="startMistakes()" ${saved.wrong.length?'':'disabled'}>Luyện lại câu sai</button><button class="btn" onclick="if(confirm('Xóa danh sách câu sai?')){saved.wrong=[];persist();render()}">Xóa danh sách</button></div></div>`+(session?questionUI():'');return}}
function topicSelect(all=false){return `<select id="topicSelect" onchange="topic=this.value;session=null;render()">${all?'<option value="all" '+(topic==='all'?'selected':'')+'>Tất cả chủ đề</option>':''}${topics.map(t=>`<option value="${t.id}" ${topic===t.id?'selected':''}>${t.name}</option>`).join('')}</select>`}function lessonUI(){let t=topics.find(x=>x.id===topic)||topics[0];return `<div class="card"><div class="top"><h2>Chọn bài học</h2>${topicSelect()}</div><div class="grid" style="margin-top:15px">${topics.map(x=>`<button class="tile" onclick="topic='${x.id}';render()"><span class="tag">${saved.done[x.id]?'✓ Đã học':'Bài '+(topics.indexOf(x)+1)}</span><strong>${x.name}</strong><span class="muted">${x.short}</span></button>`).join('')}</div></div><div class="card"><span class="tag">${t.short}</span><h2 style="margin-top:15px">${t.name}</h2><h3>1. Công thức cốt lõi</h3><div class="formula">${esc(t.rule)}</div><h3>2. Quy tắc cần nhớ</h3><p>${esc(t.notes)}</p><h3>3. Dấu hiệu & từ khóa</h3><div class="example">${esc(t.signals)}</div><h3>4. Ví dụ TOEIC</h3>${t.examples.map(e=>`<div class="example">${esc(e)} <button class="btn" onclick="say(${JSON.stringify(e)})">🔊 Nghe</button></div>`).join('')}<div class="actions"><button class="btn good" onclick="saved.done['${t.id}']=true;persist();render()">✓ Đánh dấu đã học</button><button class="btn primary" onclick="theoryTab='recall';session=null;render()">Kiểm tra trí nhớ →</button></div></div>`}
function flashUI(){let ts=topic==='all'?topics:topics.filter(t=>t.id===topic);let cards=ts.flatMap(t=>[{front:'Công thức: '+t.name,back:t.rule},{front:'Dấu hiệu: '+t.name,back:t.signals},{front:'Quy tắc: '+t.name,back:t.notes}]);cardIndex%=cards.length;let c=cards[cardIndex];return `<div class="card"><div class="top"><h2>Flashcards · ${cardIndex+1}/${cards.length}</h2>${topicSelect(true)}</div><p class="muted">Nhẩm đáp án trước, sau đó nhấn thẻ để lật.</p><div class="flash" onclick="flipped=!flipped;render()">${esc(flipped?c.back:c.front)}</div><div class="actions"><button class="btn" onclick="cardIndex=(cardIndex+${cards.length}-1)%${cards.length};flipped=false;render()">← Thẻ trước</button><button class="btn" onclick="flipped=!flipped;render()">Lật thẻ</button><button class="btn primary" onclick="cardIndex=(cardIndex+1)%${cards.length};flipped=false;render()">Thẻ tiếp →</button></div></div>`}
function recallBank(ts,types){let a=[];ts.forEach(t=>{let choices=shuffle(topics.filter(x=>x.id!==t.id)).slice(0,3);if(types.includes('Chọn công thức'))a.push({type:'Chọn công thức',topic:t.id,prompt:`Công thức của ${t.name} là gì?`,answer:t.rule,options:shuffle([t.rule,...choices.map(x=>x.rule)]),explain:t.notes});if(types.includes('Tự viết công thức'))a.push({type:'Tự viết công thức',topic:t.id,prompt:`Không nhìn tài liệu: hãy viết công thức khẳng định của ${t.name}.`,answer:t.rule.split(' · ')[0],manual:true,explain:t.rule});if(types.includes('Nhận biết dấu hiệu')){let sig=t.signals.split(',')[0].trim();a.push({type:'Nhận biết dấu hiệu',topic:t.id,prompt:`Dấu hiệu “${sig}” thường gợi ý chủ đề nào?`,answer:t.name,options:shuffle([t.name,...choices.map(x=>x.name)]),explain:`${t.name}: ${t.signals}. Một dấu hiệu có thể dùng trong nhiều ngữ cảnh.`})}if(types.includes('Đúng / Sai'))a.push({type:'Đúng / Sai',topic:t.id,prompt:`Đúng hay sai: ${t.name} có công thức ${t.rule.split(' · ')[0]}?`,answer:'Đúng',options:['Đúng','Sai'],explain:t.rule});if(types.includes('Điền quy tắc'))a.push({type:'Điền quy tắc',topic:t.id,prompt:`Viết tên tiếng Anh của thì/chủ đề: ${t.name}`,answer:t.short,manual:true,explain:t.short});if(types.includes('Ghép khái niệm'))a.push({type:'Ghép khái niệm',topic:t.id,prompt:`Chủ đề nào có quy tắc: ${t.notes}`,answer:t.name,options:shuffle([t.name,...choices.map(x=>x.name)]),explain:t.rule})});return a}
function recallUI(){return session?questionUI():setupUI('recall')}
function setupUI(mode){let types=mode==='recall'?recallTypes:practiceTypes;return `<div class="card"><h2>Thiết lập buổi ${mode==='recall'?'kiểm tra trí nhớ':'luyện tập'}</h2><p class="muted">${mode==='recall'?'Chỉ hỏi kiến thức, công thức và dấu hiệu. Không có bài vận dụng TOEIC.':'Chỉ có bài áp dụng thực tế, không hỏi thuộc lòng công thức.'}</p><label><b>Chủ đề</b></label><div style="margin:10px 0">${topicSelect(true)}</div><b>Chọn dạng bài (chọn nhiều)</b><div class="grid" style="margin:12px 0">${types.map((t,i)=>`<label class="checkline"><input type="checkbox" class="typeCheck" value="${esc(t)}" ${i<types.length?'checked':''}>${esc(t)}</label>`).join('')}</div><div class="top"><label>Số câu: <select id="count"><option>10</option><option>20</option><option>40</option><option value="all">Tất cả</option></select></label><button class="btn primary" onclick="startSession('${mode}')">Bắt đầu →</button></div></div>`}
function practiceBank(ts,types){let a=[];ts.forEach(t=>t.q.forEach(([prompt,answer,wrong,explain])=>{if(types.includes('TOEIC chọn đáp án'))a.push({type:'TOEIC chọn đáp án',topic:t.id,prompt,answer,options:shuffle([answer,...wrong.split('|')]),explain});if(types.includes('Điền từ tự luận'))a.push({type:'Điền từ tự luận',topic:t.id,prompt,answer,explain});if(types.includes('Chọn thì phù hợp'))a.push({type:'Chọn thì phù hợp',topic:t.id,prompt:`Chọn chủ đề ngữ pháp phù hợp để giải câu:\n${prompt}`,answer:t.name,options:shuffle([t.name,...shuffle(topics.filter(x=>x.id!==t.id)).slice(0,3).map(x=>x.name)]),explain})}));extra.filter(e=>ts.some(t=>t.id===e.topic)).forEach(e=>{let t=topics.find(t=>t.id===e.topic);if(types.includes('Sửa lỗi sai'))a.push({type:'Sửa lỗi sai',topic:e.topic,prompt:`Sửa câu sai:\n${e.wrong}`,answer:e.en,explain:t.notes});if(types.includes('Sắp xếp câu'))a.push({type:'Sắp xếp câu',topic:e.topic,prompt:`Sắp xếp các cụm từ thành câu đúng:\n${shuffle(e.order.split('|')).join(' / ')}`,answer:e.en,explain:t.rule});if(types.includes('Dịch Việt → Anh'))a.push({type:'Dịch Việt → Anh',topic:e.topic,prompt:e.vi,answer:e.en,manual:true,explain:t.rule});if(types.includes('Chuyển câu phủ định'))a.push({type:'Chuyển câu phủ định',topic:e.topic,prompt:`Chuyển sang phủ định:\n${e.en}`,answer:e.negative,explain:t.rule});if(types.includes('Chuyển câu nghi vấn'))a.push({type:'Chuyển câu nghi vấn',topic:e.topic,prompt:`Chuyển thành câu hỏi Yes/No:\n${e.en}`,answer:e.interrogative,explain:t.rule})});return a}
function startSession(mode){let types=[...document.querySelectorAll('.typeCheck:checked')].map(x=>x.value);if(!types.length){alert('Hãy chọn ít nhất một dạng bài.');return}let ts=topic==='all'?topics:topics.filter(x=>x.id===topic);let pool=shuffle(mode==='recall'?recallBank(ts,types):practiceBank(ts,types));let n=$('#count').value;session={mode,items:n==='all'?pool:pool.slice(0,Number(n)),index:0,score:0,answered:false,selected:'',review:[]};render()}
function norm(s){return String(s).toLowerCase().replace(/[.!?,;:]/g,'').replace(/\s+/g,' ').trim().replace(/doesn't/g,'does not').replace(/won't/g,'will not').replace(/isn't/g,'is not').replace(/aren't/g,'are not').replace(/hasn't/g,'has not').replace(/haven't/g,'have not').replace(/didn't/g,'did not')}
function questionUI(){if(!session)return '';if(session.index>=session.items.length)return `<div class="card"><h2>Hoàn thành buổi học 🎉</h2><div class="stat">${session.score}/${session.items.length}</div><p>Đúng ${Math.round(session.score/session.items.length*100||0)}%. ${session.mode==='recall'?'Hãy học lại những công thức chưa thuộc trước khi sang phần bài tập.':'Những câu sai đã được lưu để ôn lại.'}</p><div class="actions"><button class="btn primary" onclick="session=null;render()">Thiết lập lượt mới</button><button class="btn" onclick="go('mistakes')">Ôn câu sai</button></div></div>`;let q=session.items[session.index];let opts=q.options?`<div class="answers">${q.options.map((v,i)=>`<button class="choice ${session.answered?(v===q.answer?'correct':v===session.selected?'wrong':''):v===session.selected?'chosen':''}" ${session.answered?'disabled':''} onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${esc(v)}</button>`).join('')}</div>`:`<input id="written" class="input" autocomplete="off" placeholder="Nhập đáp án của bạn (Enter để kiểm tra)" ${session.answered?'disabled':''} value="${esc(session.answered?session.selected:'')}"><div class="actions"><button class="btn primary" ${session.answered?'disabled':''} onclick="checkWritten()">Kiểm tra đáp án</button></div>`;let fb=session.answered?`<div class="feedback"><b>${session.lastCorrect?'✓ Chính xác!':q.manual?'Đối chiếu đáp án mẫu':'✗ Chưa chính xác'}</b><p><b>Đáp án tham khảo:</b> ${esc(q.answer)}</p><p><b>Giải thích:</b> ${esc(q.explain)}</p>${session.mode!=='recall'?`<div class="actions"><button class="btn" onclick="say(${JSON.stringify(q.answer)})">🔊 Nghe câu</button><button class="btn" onclick="say(${JSON.stringify(q.answer)},.82)">🐢 Nghe chậm</button></div>`:''}${q.manual?`<div class="actions"><button class="btn good" onclick="selfMark(true)">Tôi làm đúng</button><button class="btn" onclick="selfMark(false)">Tôi làm sai</button></div>`:''}<div class="actions"><button class="btn primary" ${q.manual&&!session.marked?'disabled':''} onclick="nextQ()">${session.index===session.items.length-1?'Xem kết quả':'Câu tiếp → (Enter)'}</button></div></div>`:'';return `<div class="card"><div class="top"><span class="tag">${esc(q.type)}</span><span class="muted">Câu ${session.index+1}/${session.items.length} · Đúng ${session.score}</span></div><div class="progress" style="margin:17px 0"><div style="width:${100*session.index/session.items.length}%"></div></div><div class="muted">${esc(topics.find(t=>t.id===q.topic)?.name||'Ôn tập')}</div><div class="question">${esc(q.prompt)}</div>${opts}${fb}</div>`}
function selectAnswer(i){if(session.answered)return;let q=session.items[session.index];record(q,q.options[i],q.options[i]===q.answer);render()}function checkWritten(){if(session.answered)return;let v=$('#written').value.trim();if(!v)return;let q=session.items[session.index];record(q,v,q.manual?false:norm(v)===norm(q.answer));render()}function record(q,v,correct){session.answered=true;session.selected=v;session.lastCorrect=correct;session.marked=!q.manual;if(!q.manual)finishMark(q,correct)}function finishMark(q,correct){if(correct)session.score++;else{let key=q.type+'|'+q.prompt;if(!saved.wrong.some(x=>x.type+'|'+x.prompt===key))saved.wrong.push(q)}saved.stats.total++;if(correct)saved.stats.correct++;persist()}function selfMark(ok){if(session.marked)return;session.marked=true;session.lastCorrect=ok;finishMark(session.items[session.index],ok);render()}function nextQ(){if(!session.answered||!session.marked)return;session.index++;session.answered=false;session.selected='';render();let i=$('#written');if(i)i.focus()}function startMistakes(){session={mode:'practice',items:shuffle(saved.wrong),index:0,score:0,answered:false,selected:''};render()}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&session){if(session.answered&&session.marked){e.preventDefault();nextQ()}else if(!session.answered&&$('#written')){e.preventDefault();checkWritten()}}});window.addEventListener('beforeunload',()=>speechSynthesis.cancel());render();
</script></body></html>
